[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular-lab-agent"
version = "0.2.0"
description = "A reproducible, budget-aware agent for tabular classification experiments"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<1.10",
  "catboost>=1.2.8,<2", "pydantic>=2.10,<3", "typer>=0.15,<1",
  "PyYAML>=6,<7", "httpx>=0.28,<1", "joblib>=1.4,<2", "psutil>=6,<8", "Pillow>=10,<14"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
tabular-lab = "tabular_lab.cli:app"

[tool.setuptools.packages.find]
include = ["tabular_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a running Docker Linux engine and the lab image", "live: consumes a configured model API", "gpu: opt-in local Docker GPU integration"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
